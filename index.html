<style>
  :root {
    color-scheme: light;
    --bg: #dfdedb;
    --surface: #d3d2ce;
    --ink: #26251e;
    --muted: #55534b;
    --tile: #bfbdb6;
    --accent: #2456d6;
    --accent-ink: #ffffff;
    --focus: #2456d6;
    --dark: #2b2b29;
    --on-dark: #e6e5e1;

    --font: "Switzer", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;

    --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
    --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
    --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
    --step-head: clamp(2rem, 1.3rem + 2.2vw, 3.25rem);

    --gutter: clamp(16px, 1.6vw, 24px);
    --pad: clamp(24px, 4vw, 64px);
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  /* Dark palette: follows the system unless the visitor picked one */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1d1d1b; --surface: #252523; --ink: #e6e5e1; --muted: #aeaca4;
      --tile: #3a3936; --focus: #8fa9f2; --dark: #141413;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1d1d1b; --surface: #252523; --ink: #e6e5e1; --muted: #aeaca4;
    --tile: #3a3936; --focus: #8fa9f2; --dark: #141413;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: var(--step-body);
    line-height: 1.7;
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; max-width: 100%; }
  [hidden] { display: none !important; }
  h1, h2, p, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .skip { position: absolute; left: var(--gutter); top: -100px; background: var(--ink); color: var(--bg); padding: 12px 16px; z-index: 10; }
  .skip:focus { top: var(--gutter); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* Buttons: square, one fill */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 52px; padding: 0 26px;
    background: var(--accent); color: var(--accent-ink);
    font: 500 var(--step-body)/1 var(--font);
    text-decoration: none; border: 0; cursor: pointer;
    transition: transform .2s var(--ease), background-color .2s var(--ease);
  }
  .btn:hover { background: #1b45b4; }
  .btn:active { transform: scale(.97); }
  .btn--ghost { background: transparent; color: var(--on-dark); border: 2px solid var(--on-dark); }
  .btn--ghost:hover { background: transparent; opacity: .8; }

  /* ===== Home: positioning column fixed on the left, category list reads on the right ===== */
  .home { display: grid; grid-template-columns: minmax(300px, 38%) 1fr; min-height: 100svh; }
  .home__panel {
    position: sticky; top: 0; height: 100svh;
    background: var(--dark); color: var(--on-dark);
    padding: var(--pad);
    display: flex; flex-direction: column; justify-content: space-between; gap: 24px;
  }
  .home__photo { width: min(180px, 40%); aspect-ratio: 1; object-fit: cover; object-position: 50% 25%; }
  .home__id h1 { font-size: var(--step-head); font-weight: 500; line-height: 1.25; letter-spacing: 0; }
  .home__id h1 span { display: block; }
  .home__lead { margin-top: 14px; max-width: 18em; }
  .home__actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; }

  .home__list { padding: var(--pad); display: flex; align-items: center; overflow-wrap: anywhere; }
  .cats { width: 100%; border-bottom: 1px solid var(--tile); }
  .cat { border-top: 1px solid var(--tile); }
  .cat__row {
    display: grid; grid-template-columns: 7em 1fr auto; gap: 8px 20px; align-items: baseline;
    padding: 24px 0; text-decoration: none; color: inherit;
  }
  .cat__name { font-size: var(--step-lead); font-weight: 500; line-height: 1.4; }
  .cat__desc { color: var(--muted); }
  .cat__state { font-size: var(--step-small); white-space: nowrap; color: var(--muted); }
  a.cat__row .cat__state { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .3em; }
  a.cat__row:hover .cat__name { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .25em; }

  @media (max-width: 860px) {
    :root { --pad: 20px; --gutter: 20px; }
    .home { display: block; }
    .home__panel { position: static; height: auto; gap: 32px; }
    .home__photo { width: 120px; }
    .cat__row { grid-template-columns: 1fr auto; grid-template-areas: "name state" "desc desc"; padding: 20px 0; }
    .cat__name { grid-area: name; }
    .cat__state { grid-area: state; }
    .cat__desc { grid-area: desc; }
  }
</style>
